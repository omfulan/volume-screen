plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.volumepower'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.volumepower"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            // Untuk penggunaan pribadi: release APK ditandatangani otomatis
            // memakai debug keystore bawaan Android Gradle Plugin.
            // Tidak memerlukan GitHub Secrets atau keystore buatan sendiri.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}
